name: Release

# Publishes to the Visual Studio Marketplace (and Open VSX when OVSX_PAT is set) when a version tag is pushed:
#   1. bump "version" in package.json and add a "## <version>" section to CHANGELOG.md
#   2. git tag v<version> && git push origin v<version>
# Run it manually with "dry run" to build and test the package without publishing.
#
# Marketplace authentication uses Trusted Publishing (GitHub OIDC), so no token is stored anywhere.
# The publisher's Trusted Publishing policy (marketplace.visualstudio.com/manage → publisher → Trusted Publishing)
# must name this repository, the workflow file "release.yml" and the environment "marketplace".

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and test only, do not publish
        type: boolean
        default: true

permissions:
  contents: write # GitHub release
  id-token: write # Marketplace Trusted Publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Part of the OIDC token the Trusted Publishing policy checks; add required reviewers to it for a manual approval gate.
    environment: marketplace
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.dry-run == false }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Check the changelog has an entry for this version
        run: |
          if ! grep -q "^## ${{ steps.version.outputs.version }}\b" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${{ steps.version.outputs.version }}' section"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: VS Code integration tests
        run: xvfb-run -a npm test

      - name: Package
        run: npm run package -- --out "jpa-powertools-${{ steps.version.outputs.version }}.vsix"

      - name: Release notes
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## " v "([^0-9.]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Publish to Visual Studio Marketplace
        if: env.PUBLISH == 'true'
        # Trusted Publishing: vsce exchanges this job's GitHub OIDC token for a short-lived Marketplace credential.
        run: npx vsce publish --packagePath "jpa-powertools-${{ steps.version.outputs.version }}.vsix" --oidc

      - name: Publish to Open VSX
        if: env.PUBLISH == 'true' && env.OVSX_PAT != ''
        run: npx --yes ovsx@0 publish "jpa-powertools-${{ steps.version.outputs.version }}.vsix" --pat "$OVSX_PAT"

      - name: GitHub release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: jpa-powertools-${{ steps.version.outputs.version }}.vsix

      - name: Upload package (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: jpa-powertools-${{ steps.version.outputs.version }}
          path: jpa-powertools-${{ steps.version.outputs.version }}.vsix
